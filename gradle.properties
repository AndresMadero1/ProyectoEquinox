# Project-wide Gradle settings.

# Specifies the JVM arguments used for the Gradle Daemon.
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8

# Enables faster local and CI builds.
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Kotlin code style for this project.
kotlin.code.style=official

# AndroidX libraries are used instead of the legacy support libraries.
android.useAndroidX=true
android.enableJetifier=true

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
